<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1728" />
    <meta
      name="description"
      content="FitTrack Connect — personal training and nutrition management portal."
    />
    <title>FitTrack Connect | Training, nutrition & progress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Tabler includes Bootstrap 5 styles/components. MIT license: https://github.com/tabler/tabler -->
    <link
      href="https://cdn.jsdelivr.net/npm/@tabler/core@1.7.1/dist/css/tabler.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="./css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="appShell" class="app-shell">
      <aside id="sidebar" class="app-sidebar" aria-label="Primary navigation">
        <a class="brand" href="#/dashboard" aria-label="FitTrack Connect home">
          <span class="brand-symbol"><i class="bi bi-activity"></i></span>
          <span class="brand-name">FitTrack<span>Connect</span></span>
        </a>
        <div class="workspace-label">WORKSPACE</div>
        <nav class="nav-stack" aria-label="Pages">
          <a class="nav-item" href="#/dashboard" data-route-link="dashboard"
            ><i class="bi bi-grid-1x2"></i><span>Overview</span></a
          >
          <a class="nav-item" href="#/plans" data-route-link="plans"
            ><i class="bi bi-journal-text"></i><span>Workout plans</span></a
          >
          <a class="nav-item" href="#/exercises" data-route-link="exercises"
            ><i class="bi bi-lightning-charge"></i
            ><span>Exercise library</span></a
          >
          <a class="nav-item" href="#/progress" data-route-link="progress"
            ><i class="bi bi-graph-up-arrow"></i
            ><span>Progress tracker</span></a
          >
          <a
            class="nav-item"
            href="#/appointments"
            data-route-link="appointments"
            ><i class="bi bi-calendar2-week"></i><span>Appointments</span></a
          >
          <a class="nav-item" href="#/nutrition" data-route-link="nutrition"
            ><i class="bi bi-egg-fried"></i><span>Nutrition explorer</span
            ><span class="nav-pill">API</span></a
          >
        </nav>
        <div class="workspace-label mt-4">ACCOUNT</div>
        <nav class="nav-stack" aria-label="Account">
          <a class="nav-item" href="#/users" data-route-link="users"
            ><i class="bi bi-people"></i><span>User management</span></a
          >
          <a class="nav-item" href="#/profile" data-route-link="profile"
            ><i class="bi bi-person-circle"></i><span>My profile</span></a
          >
          <a class="nav-item" href="#/login" data-route-link="login"
            ><i class="bi bi-box-arrow-right"></i
            ><span>Sign out / login</span></a
          >
        </nav>
        <div class="side-bottom">
          <div class="side-bottom-icon"><i class="bi bi-stars"></i></div>
          <strong>Build better habits.</strong>
          <p>One session, one meal, one win at a time.</p>
        </div>
      </aside>
      <div
        id="sidebarBackdrop"
        class="sidebar-backdrop"
        data-action="close-menu"
      ></div>
      <div class="app-main">
        <header class="topbar">
          <div class="d-flex align-items-center gap-3">
            <button
              type="button"
              class="icon-button mobile-menu"
              data-action="toggle-menu"
              aria-label="Toggle menu"
            >
              <i class="bi bi-list"></i>
            </button>
            <div>
              <span class="topbar-eyebrow">FITTRACK / </span
              ><span class="topbar-current" id="breadcrumb">Overview</span>
            </div>
          </div>
          <div class="topbar-actions">
            <span class="demo-label"
              >
            <label for="demoRole" class="visually-hidden"
              >Choose role</label
            >
            <select
              id="demoRole"
              class="form-select role-picker"
              title="Preview a role (not authentication)"
            >
              <option value="client">Client preview</option>
              <option value="trainer">Trainer preview</option>
              <option value="admin">Admin preview</option>
            </select>
            <a href="#/profile" class="avatar-circle" aria-label="Profile"
              >JD</a
            >
          </div>
        </header>
        <main id="appView" class="view-container" aria-live="polite"></main>
        <footer class="footer-note">
          FitTrack Connect 
        </footer>
      </div>
    </div>
    <section id="authShell" class="auth-shell d-none" aria-live="polite">
      <div id="authView"></div>
    </section>

    <dialog
      id="editorDialog"
      class="editor-dialog"
      aria-labelledby="editorTitle"
    >
      <form id="editorForm" class="editor-panel" method="dialog">
        <div class="dialog-heading">
          <div>
            <div class="eyebrow">QUICK EDITOR</div>
            <h2 id="editorTitle">Add item</h2>
          </div>
          <button
            class="icon-button"
            type="button"
            data-action="close-dialog"
            aria-label="Close dialog"
          >
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <div id="editorFields" class="dialog-fields"></div>
        <div class="dialog-actions">
          <button
            class="btn btn-outline-secondary"
            type="button"
            data-action="close-dialog"
          >
            Cancel</button
          ><button class="btn btn-accent" type="submit">
            Save changes <i class="bi bi-arrow-right"></i>
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="app-toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.7.1/dist/js/tabler.min.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
